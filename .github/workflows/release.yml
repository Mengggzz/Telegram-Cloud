name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Decode Keystore & Create key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from secret..."
            echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$GITHUB_WORKSPACE/android/app/tgcloud-release.keystore"
            if keytool -list -keystore "$GITHUB_WORKSPACE/android/app/tgcloud-release.keystore" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
              echo "Keystore and credentials verified successfully."
              printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=tgcloud-release.keystore\n' "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > "$GITHUB_WORKSPACE/android/key.properties"
            else
              echo "WARNING: Keystore verification failed with given credentials! Printing keytool diagnosis:"
              keytool -list -keystore "$GITHUB_WORKSPACE/android/app/tgcloud-release.keystore" -storepass "$KEYSTORE_PASSWORD" 2>&1 || true
            fi
          else
            echo "Keystore secret not found, skipping release signing (fallback to debug)"
          fi

      - name: Build Split APKs
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/debug-info --android-skip-build-dependency-validation -v

      - name: Rename APKs for Release
        run: |
          mkdir -p release-apks
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-apks/tgcloud-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-apks/tgcloud-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release-apks/tgcloud-x86_64.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Release ${{ github.ref_name }}
          files: |
            release-apks/tgcloud-arm64-v8a.apk
            release-apks/tgcloud-armeabi-v7a.apk
            release-apks/tgcloud-x86_64.apk
          draft: false
          prerelease: false
          generate_release_notes: true

  build-windows:
    name: Build Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Compress Windows Release
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "tgcloud-windows-x64.zip"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tgcloud-windows-x64
          path: tgcloud-windows-x64.zip

      - name: Attach Windows Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: tgcloud-windows-x64.zip
